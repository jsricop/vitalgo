version: '3.8'

services:
  # Backend API - Using remote image
  backend:
    image: ${DOCKER_USERNAME:-your-dockerhub-username}/vitalgo-backend:${IMAGE_VERSION:-latest}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: production
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports:
      - "8000:8000"
    networks:
      - vitalgo-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend (Next.js) - Using remote image
  frontend:
    image: ${DOCKER_USERNAME:-your-dockerhub-username}/vitalgo-frontend:${IMAGE_VERSION:-latest}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - vitalgo-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  vitalgo-network:
    driver: bridge